<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Pontok beküldése</h2>

          <form name="registrationForm" 
                ng-submit="submitForm()" 
                class="needs-validation"
                autocomplete="off" 
                novalidate>

            <!-- Teljes név -->
            <div class="mb-3" 
                 ng-class="{'has-error': registrationForm.name.$touched && registrationForm.name.$invalid}">
              <label for="name" class="form-label">Teljes név</label>
              <input type="text" 
                     class="form-control" 
                     id="name" 
                     name="name" 
                     ng-model="data.name" 
                     required>
              <div class="invalid-feedback d-block" 
                   ng-show="registrationForm.name.$touched && registrationForm.name.$invalid">
                A név megadása kötelező.
              </div>
            </div>

            <!-- Pontok -->
            <div class="mb-3">
              <label for="score" class="form-label">Pontok</label>
              <input type="text" 
                     class="form-control text-muted" 
                     id="score" 
                     name="score" 
                     ng-model="data.score" 
                     required
                     disabled>
            </div>

            <!-- Regisztráció gomb -->
            <div class="d-grid mb-3">
              <button type="submit" 
                      class="btn btn-primary" 
                      ng-disabled="registrationForm.$invalid"
                      ng-click="register()">
                Beküldés
              </button>
            </div>

            <!-- Vissza gomb -->
            <div class="d-grid">
              <button type="submit" 
                      class="btn btn-danger" 
                      ng-click="submit()">
                Vissza
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
