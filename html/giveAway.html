<div class="container">
  <div class="row mt-5">
    <h1 class="text-center">Sorsolás</h1>
    
  </div>
  <div class="row mt-5">
    <h1 class="text-center display-1"
        style="min-height:200px">
      {{name}}
    </h1>
  </div>
  <div class="row justify-content-center">
    <button class="btn btn btn-primary mx-2 w-auto mb-3"
						ng-click="methods.start()"
            style="min-width: 160px;"
            ng-disabled="started"> 
      Sorsolás
		</button>
    <button class="btn btn btn-danger mx-2 w-auto mb-3"
						ng-click="methods.stop()"
            style="min-width: 160px;"
            ng-disabled="!started"> 
      Megállít
		</button>
    <button class="btn btn btn-secondary mx-2 w-auto mb-3"
						ng-click="methods.goBack()"
            style="min-width: 160px;"
            ng-disabled="started"> 
      Kilép
		</button>
  </div>
</div>
