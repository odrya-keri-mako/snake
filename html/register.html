<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Regisztráció</h2>

          <form name="registrationForm" 
                ng-submit="submitForm()" 
                class="needs-validation" 
                novalidate>

            <!-- Teljes név -->
            <div class="mb-3" 
                 ng-class="{'has-error': registrationForm.name.$touched && registrationForm.name.$invalid}">
              <label for="name" class="form-label">Teljes név</label>
              <input type="text" 
                     class="form-control" 
                     id="name" 
                     name="name" 
                     ng-model="data.name" 
                     required>
              <div class="invalid-feedback d-block" 
                   ng-show="registrationForm.name.$touched && registrationForm.name.$invalid">
                A név megadása kötelező.
              </div>
            </div>

            <!-- Pontok -->
            <div class="mb-3">
              <label for="score" class="form-label">Pontok</label>
              <input type="text" 
                     class="form-control text-muted" 
                     id="score" 
                     name="score" 
                     ng-model="data.score" 
                     required
                     disabled>
            </div>

            <!-- Regisztráció gomb -->
            <div class="d-grid mb-3">
              <button type="submit" 
                      class="btn btn-primary" 
                      ng-disabled="registrationForm.$invalid"
                      ng-click="register()">
                Regisztráció
              </button>
            </div>

            <!-- Vissza gomb -->
            <div class="d-grid">
              <button type="submit" 
                      class="btn btn-danger" 
                      ng-click="return()">
                Vissza
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- Top Lista -->
      <div class="card shadow-sm mt-4">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Top Lista</h2>
          <table class="table table-striped table-borderless mb-0">
            <thead>
              <tr>
                <th>Név</th>
                <th>Pontszám</th>
                <th>Dátum</th>
              </tr>
            </thead>  
            <tbody>
              <tr ng-repeat="x in topList">
                <td>{{x.name}}</td>
                <td>{{x.score}}</td>
                <td>{{x.timestamp}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
