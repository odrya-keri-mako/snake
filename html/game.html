<!-- Title/Logo -->
		<div class="row justify-content-center mt-3">

			<!-- Title/countdown -->
			<div class="display-6 text-center col-9">
				<img ng-src="./img/snake.ico" width="50" height="50" alt="snake">
				<span class="align-middle">Snake</span>
				<img ng-class="{'d-none': !(game.countdown === null || game.countdown <= 0)}" ng-src="./img/snake.ico" width="50" height="50" alt="snake">
				<span class="text-center align-middle d-inline-block fw-bold text-warning"
							style="width:30px!important;"
							ng-class="{'d-none': game.countdown === null || game.countdown <= 0}">
					{{game.countdown}}
				</span>
			</div>

			<!-- Logo -->
			<div class="text-center col-3 m-0 p-0 d-flex align-items-center justify-content-center">
				<div class="logo bg-img bg-img-contain m-0 p-0"></div>
				<h3 class="ms-3 mb-0 d-flex flex-column w-auto">
					<span class="fs-3 align-middle">KERI</span>
					<span class="fs-6 align-baseline">Makó</span>
				</h3>
			</div>
		</div>

		<!-- Game/Options/Audio -->
		<div class="row justify-content-center my-3">

			<!-- Game panel -->
			<div class="col-12 col-xxl-9 mb-0">

				<!-- Panel -->
				<div class="row justify-content-center mb-3">
					<div class="game-container d-table w-auto p-0 m-0"
							 ng-class="{'border-blink': game.status === 'ended'}">	
						<table class="game-panel table table-bordered w-auto m-0">
							<tbody>
								<tr ng-repeat="row in [].constructor(options.size.x) track by $index">
									<td class="p-0 text-center position-relative"
											ng-repeat="col in [].constructor(options.size.y) track by $index"
											row="{{$parent.$index}}" col="{{$index}}">
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>

				<!-- Buttons -->
				<div class="row justify-content-center mt-3">

					<!-- Start -->
					<button type="button" 
									class="btn btn-sm btn-success w-auto mx-2"
									ng-click="methods.start()"
									ng-disabled="game.status==='started'||game.status==='ended'">
						<i class="fa-solid fa-play me-1"></i>
						<span class="text-capitalize">start</span>
					</button>

					<!-- Pause -->
					<button type="button" 
									class="btn btn-sm btn-warning w-auto mx-2"
									ng-click="methods.pause()"
									ng-disabled="(game.status!=='started'&&game.status === 'paused')
												  		  || options.playerID == 'human'
																|| options.playerID == 'human_mp'
																|| game.status == 'ended'"
									ng-show="!options.isHuman">
						<i class="fa-solid fa-pause me-1"></i>
						<span class="text-capitalize">megállít</span>
					</button>

					<!-- Stop -->
					<button type="button" 
									class="btn btn-sm btn-danger w-auto mx-2"
									ng-click="methods.stop()"
									ng-disabled="game.status==='stopped'">	
						<i class="fa-solid fa-stop me-1"></i>
						<span class="text-capitalize">stop</span>
					</button>

					<!-- Refresh -->
					<button type="button" 
									class="btn btn-sm btn-info w-auto mx-2"
									ng-click="methods.refresh()"
									ng-disabled="game.status!=='stopped'">	
						<i class="fa-solid fa-rotate me-1"></i>
						<span class="text-capitalize">frissítés</span>
					</button>

					<!-- Autoplay -->
					<div class="form-check form-switch form-check-inline 
											form-select-sms ms-2 w-auto my-auto">
						<input id="autoPlay"
									 class="form-check-input" 
									 type="checkbox"
									 role="switch" 
									 ng-model="options.autoPlay"
									 ng-disabled="game.status!=='stopped'">
						<label class="form-check-label" for="autoPlay">
							automatikus {{options.isHuman ? "frissítés" : "játék"}}
						</label>
					</div>
				</div>

				<div class="row mt-3">
					<h1 ng-show="game.winner != null" class="text-center d-inline-block fw-bold text-warning">
						<span>A játék nyertese a</span>
						<span ng-class="[game.winner === 'smaragd' ? 'text-success' : 'text-danger']">{{ game.winner }}</span>!
					</h1>
				</div>

				<!-- Audio -->
				<audio id="audioEated" controls="false" class="d-none m-0 p-0">
					<source src="./sound/eated.mp3" type="audio/mpeg">
				</audio>
				<audio id="audioEnded" controls="false" class="d-none m-0 p-0">
					<source src="./sound/ended.mp3" type="audio/mpeg">
				</audio>
			</div>

			<!-- Options panel -->
			<div class="col-12 col-xxl-3 mb-5 mt-3 mt-xxl-0">
				<div class="row justify-content-center justify-content-xxl-start">

					<!-- Form -->
					<form class="border py-2" name="optionsForm" novalidate>

						<!-- Row -->
						<div class="row mb-2" ng-if="options.playerID === 'astar_e'">
							<label for="panel-size-x" 
		   					 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
	  					<span class="text-capitalize">sor:</span>
						</label>
						<div class="col-12 col-md-7">
	  					<input id="panel-size-x"
								class="form-control form-control-sm"
								name="x" 
								type="number"
								autocomplete="off" 
								required
								min="10"
								max="30"
								onkeydown="return false"
								ng-model="options.size.x"
								ng-disabled="game.status !== 'stopped'"
						>
						</div>
						</div>

						<!-- Col -->
						<div class="row mb-2" ng-if="options.playerID === 'astar_e'">
							<label for="panel-size-y" 
		   					 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
	  					<span class="text-capitalize">oszlop:</span>
						</label>
						<div class="col-12 col-md-7">
	  					<input id="panel-size-y"
								 class="form-control form-control-sm"
								 name="y" 
								 type="number"
								 autocomplete="off" 
								 required
								 min="10"
								 max="35"
								 onkeydown="return false"
								 ng-model="options.size.y"
								 ng-disabled="game.status !== 'stopped'">
						</div>
						</div>

						<!-- Stones -->
						<div class="row mb-2" ng-if="options.playerID !== 'human'">
							<label for="snake-stones" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">kövek:</span>
							</label>
							<div class="col-12 col-md-7">
								<input id="snake-stones"
											 class="form-control form-control-sm"
											 name="stones" 
											 type="number"
											 autocomplete="off" 
											 required
											 min="0"
											 max="{{game.maxStones}}"
								 			 onkeydown="return false"
											 ng-model="options.stones"
											 ng-disabled="game.status !== 'stopped'">
							</div>
						</div>

						<!-- Apples -->
						<div class="row mb-2" ng-if="options.playerID !== 'human'">
							<label for="snake-apples" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">almák:</span>
							</label>
							<div class="col-12 col-md-7">
								<input id="snake-apples"
											 class="form-control form-control-sm"
											 name="apples" 
											 type="number"
											 autocomplete="off" 
											 required
											 min="1"
											 max="15"
								 			 onkeydown="return false"
											 ng-model="options.apples"
											 ng-disabled="game.status !== 'stopped'">
							</div>
						</div>

						<!-- Delay -->
						<div class="row mb-2">
							<label for="snake-delay" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">sebesség:</span>
							</label>
							<div class="col-12 col-md-7">
								<select 
									id="snake-delay" 
									class="form-select form-select-sm"
									ng-model="options.delay" 
									required
									ng-disabled="game.status !== 'stopped'"
								>
									<option ng-value="200">
										Lassú 
										<span ng-if="options.playerID === 'human'">(0.5x pont)</span>
									</option>
									<option ng-value="100" selected>
										Normál 
										<span ng-if="options.playerID === 'human'">(1x pont)</span>
									</option>
									<option ng-value="50">
										Gyors 
										<span ng-if="options.playerID === 'human'">(1.5x pont)</span>
									</option>
									<option ng-value="25">
										Sebes 
										<span ng-if="options.playerID === 'human'">(2x pont)</span>
									</option>
								</select>
							</div>
						</div>

						<!-- Player -->
						<div class="row mb-2">
							<label for="snake-player" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">játékos:</span>
							</label>
							<div class="col-12 col-md-7">
								<select id="snake-player"
												class="form-select form-select-sm"
												ng-model="options.playerID" 
												ng-change="methods.refresh()"
												ng-options="x.id as x.name disable when !x.valid 
																		for x in options.players"
												required
												style="min-width:170px;"
												ng-disabled="game.status!=='stopped'">
								</select>
							</div>
						</div>

						<!-- Reset Options -->
						<div class="row mb-1">
							<label for="reset" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">Beállítások visszaállítása:</span>
							</label>
							<div class="col-12 col-md-7">
								<button id="reset"
												class="btn btn-outline-danger w-100 h-100"
												ng-click="methods.resetOptions()"
												ng-disabled="game.status!=='stopped'"> Visszaállítás
								</button>
							</div>
						</div>
						<hr class="my-2" ng-if="options.playerID !== 'human_mp'">

						<!-- Snake length -->
						<div class="row mb-2" ng-if="options.playerID !== 'human_mp'">
							<label for="snake-length" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">hossz:</span>
							</label>
							<div class="col-12 col-md-7">
								<input id="snake-length"
											 class="form-control form-control-sm text-end"
											 name="snakeLength" 
											 type="number"
											 ng-model="game.snakeLength"
											 disabled>
							</div>
						</div>

						<!-- Elapsed time -->
						<div class="row mb-2" ng-if="options.playerID !== 'human_mp'">
							<label for="snake-time" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">idő:</span>
							</label>
							<div class="col-12 col-md-7">
								<input id="snake-time"
											 class="form-control form-control-sm text-end pe-4"
											 name="time" 
											 type="text"
											 ng-model="game.time"
											 disabled>
							</div>
						</div>

						<!-- Score -->
						<div class="row mb-1" ng-if="options.playerID !== 'human_mp'">
							<label for="snake-score" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">pontok:</span>
							</label>
							<div class="col-12 col-md-7">
								<input id="snake-score"
											 class="form-control form-control-sm text-end"
											 name="score" 
											 type="number"
											 ng-model="game.score"
											 disabled>
							</div>
						</div>
						<hr class="my-2">

						<!-- Attempt -->
						<div class="row mb-2">
							<label for="snake-attempt" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">próba:</span>
							</label>
							<div class="col-12 col-md-7">
								<div class="input-group">
									<input id="snake-attempt"
												class="form-control form-control-sm text-end"
												name="attempt" 
												type="number"
												ng-model="game.attempt"
												disabled>
								</div>
							</div>
						</div>

						<!-- Peak (top score) -->
						<div class="row mb-2">
							<label for="snake-peak" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">legtöbb pont:</span>
							</label>
							<div class="col-12 col-md-7">
								<div class="input-group">
									<button id="peak-reset"
													class="btn btn-sm btn-outline-danger text-capitalize" 
													type="button"
													ng-disabled="game.status!=='stopped'"
													title="Reset peak (top score)"
													ng-click="methods.resetPeak()">
										<i class="fa-solid fa-xmark"></i>
									</button>
									<input id="snake-peak"
												class="form-control form-control-sm text-end"
												name="peak" 
												type="number"
												ng-model="game.peak"
												disabled>
								</div>
							</div>
						</div>

						<!-- submit top score -->
						<div class="row mb-2" ng-if="options.playerID === 'human'">
							<label for="submit" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">Pontok beküldése:</span>
							</label>
							<div class="col-12 col-md-7">
								<button id="submit"
												class="btn btn-sm btn-primary w-100 h-100"
												ng-click="methods.submitPeak()"
												ng-disabled="game.status!=='stopped'"> Beküldés
								</button>
								</select>
							</div>
						</div>

						<!-- View top list -->
						<div class="row mb-1">
							<label for="topList" 
										 class="col-form-label col-form-label-sm col-12 col-md-5 text-md-end">
								<span class="text-capitalize">Top Lista:</span>
							</label>
							<div class="col-12 col-md-7">
								<button id="topList"
												class="btn btn-sm btn-primary w-100 h-100"
												ng-click="methods.viewTopList()"
												ng-disabled="game.status!=='stopped'"> Megnéz
								</button>
								</select>
							</div>
						</div>
					</form>
				</div>
				<div class="row justify-content-center justify-content-xxl-start mt-2 text-secondary">
						<p class="mb-0">&copy; 2024-2025</p>
						<p>osztály: 13c</p>
				</div>
			</div>
		</div>
